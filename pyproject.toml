[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "long-context-lab"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
long-context-lab = "long_context_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["long_context_lab*"]
